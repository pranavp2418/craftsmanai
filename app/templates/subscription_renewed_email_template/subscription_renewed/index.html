<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscription Renewed</title>
</head>
<body style="margin:0;padding:0;background-color:#08081a;font-family:Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#08081a;">
    <tr><td align="center" style="padding:40px 16px;">
      <table width="480" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;background-color:#0f0f2a;border-radius:16px;">
        <tr><td style="padding:0;"><div style="height:4px;background:linear-gradient(90deg,#3b82f6,#8b5cf6,#ec4899);"></div></td></tr>
        <tr><td align="center" style="padding:36px 40px 8px;"><img src="https://craftsmanai.app/dark%20mode%20logo.png" alt="Craftsman AI" width="160" style="max-width:100%;"></td></tr>
        <tr><td align="center" style="padding:16px 40px 8px;"><h1 style="margin:0;font-size:24px;color:#fff;">Subscription Renewed</h1></td></tr>
        <tr><td align="center" style="padding:4px 40px 20px;"><p style="margin:0;font-size:14px;color:#9ca3af;">Your {{plan_name}} plan has been renewed.</p></td></tr>
        <tr><td style="padding:0 40px 24px;">
          <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#151533;border-radius:12px;">
            <tr><td style="padding:14px 20px;border-bottom:1px solid rgba(255,255,255,0.06);"><table width="100%"><tr><td style="font-size:13px;color:#9ca3af;">Plan</td><td align="right" style="font-size:13px;color:#fff;font-weight:600;">{{plan_name}}</td></tr></table></td></tr>
            <tr><td style="padding:14px 20px;border-bottom:1px solid rgba(255,255,255,0.06);"><table width="100%"><tr><td style="font-size:13px;color:#9ca3af;">Renewal Amount</td><td align="right" style="font-size:13px;color:#fff;font-weight:600;">{{amount}}</td></tr></table></td></tr>
            <tr><td style="padding:14px 20px;border-bottom:1px solid rgba(255,255,255,0.06);"><table width="100%"><tr><td style="font-size:13px;color:#9ca3af;">Next Renewal</td><td align="right" style="font-size:13px;color:#fff;font-weight:600;">{{next_renewal_date}}</td></tr></table></td></tr>
            <tr><td style="padding:14px 20px;"><table width="100%"><tr><td style="font-size:13px;color:#9ca3af;">Status</td><td align="right" style="font-size:13px;color:#3b82f6;font-weight:600;">Renewed</td></tr></table></td></tr>
          </table>
        </td></tr>
        <tr><td align="center" style="padding:0 40px 16px;">
          <table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td align="center" style="border-radius:50px;background:linear-gradient(135deg,#7c3aed,#a855f7,#ec4899);"><a href="{{invoice_url}}" style="display:inline-block;padding:14px 40px;font-size:15px;font-weight:600;color:#fff;text-decoration:none;border-radius:50px;">View Invoice</a></td></tr></table>
        </td></tr>
        <tr><td align="center" style="padding:0 40px 36px;"><p style="margin:0;font-size:12px;color:#6b7280;">Your subscription has been renewed.</p></td></tr>
      </table>
      <table width="480" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;"><tr><td align="center" style="padding:24px 40px 16px;"><p style="margin:0;font-size:12px;color:#4b5563;">© 2026 Craftsman AI</p></td></tr></table>
    </td></tr>
  </table>
</body>
</html>
