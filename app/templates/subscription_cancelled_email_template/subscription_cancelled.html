<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Cancelled</title>
</head>
<body style="margin: 0; padding: 0; background-color: #0b0c10; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #ffffff;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #0b0c10; padding: 40px 20px;">
        <tr>
            <td align="center">
                <!-- Main Card -->
                <table role="presentation" width="100%" max-width="500" cellspacing="0" cellpadding="0" border="0" style="background-color: #15161e; border-radius: 12px; border-top: 2px solid #3b82f6; max-width: 500px; width: 100%; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
                    <tr>
                        <td align="center" style="padding: 40px 30px;">
                            <!-- Logo Inside Card -->
                            <img src="https://craftsmanai.app/dark%20mode%20logo.png" alt="CraftsmanAI Logo" width="150" style="display: block; max-width: 150px; height: auto; margin-bottom: 30px;">

                            <!-- Icon -->
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin-bottom: 20px;">
                                <tr>
                                    <td align="center" valign="middle" style="width: 48px; height: 48px; border-radius: 50%; border: 2px solid #ef4444;">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: block; margin: 0 auto;"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                                    </td>
                                </tr>
                            </table>

                            <!-- Title -->
                            <h1 style="margin: 0 0 10px 0; font-size: 22px; font-weight: 600; color: #ffffff;">Subscription cancelled</h1>
                            
                            <!-- Subtitle -->
                            <p style="margin: 0 0 10px 0; font-size: 14px; color: #9ca3af;">Your CraftsmanAI subscription has been cancelled.</p>

                            <!-- Details Table -->
                            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin-bottom: 30px;">
                                <tr>
                                    <td style="padding: 12px 0; border-bottom: 1px solid #2a2b3d; font-size: 14px; color: #9ca3af;">Plan</td>
                                    <td align="right" style="padding: 12px 0; border-bottom: 1px solid #2a2b3d; font-size: 14px; color: #ffffff; font-weight: 500;">{{plan_name}}</td>
                                </tr>
                                <tr>
                                    <td style="padding: 12px 0; border-bottom: 1px solid #2a2b3d; font-size: 14px; color: #9ca3af;">Access until</td>
                                    <td align="right" style="padding: 12px 0; border-bottom: 1px solid #2a2b3d; font-size: 14px; color: #ffffff; font-weight: 500;">{{access_end_date}}</td>
                                </tr>
                                <tr>
                                    <td style="padding: 12px 0; border-bottom: 1px solid #2a2b3d; font-size: 14px; color: #9ca3af;">Cancellation date</td>
                                    <td align="right" style="padding: 12px 0; border-bottom: 1px solid #2a2b3d; font-size: 14px; color: #ffffff; font-weight: 500;">{{cancellation_date}}</td>
                                </tr>
                                <tr>
                                    <td style="padding: 12px 0; font-size: 14px; color: #9ca3af;">Status</td>
                                    <td align="right" style="padding: 12px 0; font-size: 14px; color: #ef4444; font-weight: 600;">Cancelled</td>
                                </tr>
                            </table>

                            <!-- Button -->
                            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                                <tr>
                                    <td align="center">
                                        <a href="{{manage_billing_url}}" style="display: inline-block; width: 100%; padding: 14px 0; background-color: #d946ef; background-image: linear-gradient(to right, #8b5cf6, #d946ef); border-radius: 25px; color: #ffffff; text-decoration: none; font-size: 15px; font-weight: 600; text-align: center;">Manage Billing</a>
                                    </td>
                                </tr>
                            </table>

                            <!-- Footer Inside Card -->
                            <div style="margin-top: 40px; font-size: 12px; color: #6b7280; border-top: 1px solid #2a2b3d; padding-top: 20px;">
                                &copy; 2026 CraftsmanAI. All rights reserved. &bull; <a href="mailto:support@craftsmanai.app" style="color: #3b82f6; text-decoration: none;">support@craftsmanai.app</a>
                            </div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
